<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mini Arknights Web</title>
  <style>
    body { background:#111; color:white; text-align:center; font-family:sans-serif; }
    canvas { background:#222; margin-top:10px; border:2px solid #555; }
    button { padding:8px 16px; font-size:16px; margin:10px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>Mini Arknights Web (Demo)</h1>
  <p>Bấm vào ô vuông để đặt Operator</p>
  <button onclick="startGame()">Start</button>
  <canvas id="game" width="480" height="480"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const gridSize = 6;
    const tile = 80;

    let operators = [];
    let enemies = [];
    let hp = 10;
    let gold = 10;

    function drawGrid() {
      for (let x = 0; x < gridSize; x++) {
        for (let y = 0; y < gridSize; y++) {
          ctx.strokeStyle = "#555";
          ctx.strokeRect(x * tile, y * tile, tile, tile);
        }
      }
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / tile);
      const y = Math.floor((e.clientY - rect.top) / tile);

      operators.push({ x, y, cd: 0 });
    });

    function spawnEnemy() {
      enemies.push({ x: 0, y: Math.floor(Math.random() * gridSize), hp: 3 });
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      // Operators
      operators.forEach(op => {
        ctx.fillStyle = "cyan";
        ctx.fillRect(op.x * tile + 10, op.y * tile + 10, 60, 60);

        op.cd--;
        if (op.cd <= 0) {
          enemies.forEach(en => {
            if (en.y === op.y && en.x > op.x) {
              en.hp--;
              op.cd = 30;
            }
          });
        }
      });

      // Enemies
      enemies.forEach(en => {
        en.x += 0.01;
        ctx.fillStyle = "red";
        ctx.fillRect(en.x * tile + 20, en.y * tile + 20, 40, 40);
      });

      enemies = enemies.filter(en => en.hp > 0 && en.x < gridSize);

      requestAnimationFrame(update);
    }

    function startGame() {
      setInterval(spawnEnemy, 1500);
      update();
    }
  </script>
</body>
</html>
