<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Mini Arknights Web</title>
<style>
  body{
    margin:0;
    background:#111;
    color:#eee;
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
  }
  #ui{
    width:900px;
    padding:16px;
  }
  h1{ text-align:center; margin:8px 0 12px; }
  #game{
    display:grid;
    grid-template-columns: repeat(10, 56px);
    grid-template-rows: repeat(6, 56px);
    gap:4px;
    background:#222;
    padding:8px;
    border:2px solid #444;
    position:relative;
  }
  .cell{
    width:56px;height:56px;
    background:#1a1a1a;
    border:1px solid #333;
    position:relative;
    cursor:pointer;
  }
  .road{ background:#2b2b2b; }
  .operator{
    width:40px;height:40px;
    background:#00e5ff;
    border-radius:6px;
    position:absolute;
    top:8px; left:8px;
  }
  .enemy{
    width:22px;height:22px;
    background:#ff3b3b;
    border-radius:50%;
    position:absolute;
    transition: all 0.25s linear;
  }
  .bullet{
    width:6px;height:6px;
    background:#ffd54f;
    border-radius:50%;
    position:absolute;
    pointer-events:none;
  }
  #panel{
    margin-top:10px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  button{
    padding:6px 10px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="ui">
  <h1>Mini Arknights Web</h1>
  <div id="game"></div>
  <div id="panel">
    <button id="start">Start Wave</button>
    <span>Click ô trống để đặt Operator (màu xanh)</span>
  </div>
</div>

<script>
const W = 10, H = 6;
const game = document.getElementById("game");
const cells = [];
const enemies = [];
const operators = [];

// đường đi uốn khúc (giống lane trong Arknights)
const path = [
  [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],
  [7,3],[7,4],
  [6,4],[5,4],[4,4],[3,4],[2,4],[1,4],
  [1,3],[1,2],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1]
];

function idx(x,y){ return y*W + x; }

// tạo map
for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
    const c = document.createElement("div");
    c.className = "cell";
    c.onclick = ()=> placeOperator(x,y,c);
    game.appendChild(c);
    cells.push(c);
  }
}

// tô đường đi
path.forEach(([x,y])=>{
  cells[idx(x,y)].classList.add("road");
});

function placeOperator(x,y,cell){
  if(cell.querySelector(".operator")) return;
  if(cell.classList.contains("road")) return;

  const op = document.createElement("div");
  op.className = "operator";
  cell.appendChild(op);
  operators.push({x,y,el:op});
}

// spawn quái liên tục
function spawnEnemy(){
  const e = document.createElement("div");
  e.className = "enemy";
  game.appendChild(e);
  enemies.push({el:e, step:0, hp:3});
}

function moveEnemies(){
  enemies.forEach((enemy, i)=>{
    if(enemy.step >= path.length){
      enemy.el.remove();
      enemies.splice(i,1);
      return;
    }
    const [x,y] = path[enemy.step];
    enemy.el.style.left = (x*60 + 18) + "px";
    enemy.el.style.top  = (y*60 + 18) + "px";
    enemy.step++;
  });
}

function shoot(){
  operators.forEach(op=>{
    enemies.forEach((enemy, i)=>{
      const ex = path[Math.max(0, enemy.step-1)]?.[0] ?? 0;
      const ey = path[Math.max(0, enemy.step-1)]?.[1] ?? 0;
      const dx = ex - op.x;
      const dy = ey - op.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist <= 3){
        const b = document.createElement("div");
        b.className = "bullet";
        b.style.left = (op.x*60 + 28) + "px";
        b.style.top  = (op.y*60 + 28) + "px";
        game.appendChild(b);
        setTimeout(()=>b.remove(),200);

        enemy.hp--;
        if(enemy.hp <= 0){
          enemy.el.remove();
          enemies.splice(i,1);
        }
      }
    });
  });
}

document.getElementById("start").onclick = ()=>{
  let count = 0;
  const spawner = setInterval(()=>{
    spawnEnemy();
    count++;
    if(count > 20) clearInterval(spawner);
  }, 400);
};

setInterval(moveEnemies, 300);
setInterval(shoot, 500);
</script>
</body>
</html>
