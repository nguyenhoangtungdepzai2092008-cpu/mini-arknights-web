<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Mini Arknights Web</title>
  <style>
    body {
      background: #0f1115;
      color: #e6e6e6;
      font-family: system-ui, Arial, sans-serif;
      text-align: center;
    }
    h1 { margin: 12px 0; }

    #game {
      margin: 0 auto;
      width: 360px;
      display: grid;
      grid-template-columns: repeat(6, 60px);
      grid-template-rows: repeat(6, 60px);
      gap: 4px;
      background: #222;
      padding: 8px;
      border-radius: 8px;
    }

    .cell {
      width: 60px;
      height: 60px;
      background: #1a1d24;
      border: 1px solid #444;
      position: relative;
      cursor: pointer;
    }

    .operator {
      background-image: url("assets/operator.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .enemy {
      background-image: url("assets/enemy.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: walk 0.4s infinite alternate;
    }

    @keyframes walk {
      from { transform: translateY(0); }
      to { transform: translateY(-2px); }
    }

    #ui {
      margin-top: 10px;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .road {
      background: #2a2f3a;
    }

    .bullet {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #00e5ff;
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Mini Arknights Web</h1>
  <div>Click ô để đặt Operator • Quái đi theo đường • Operator tự bắn</div>

  <div id="game"></div>

  <div id="ui">
    <button id="startBtn">Start</button>
  </div>

  <script>
    const SIZE = 6;
    const game = document.getElementById("game");
    const startBtn = document.getElementById("startBtn");

    const grid = [];
    const enemies = [];
    const operators = [];

    // đường đi của quái
    const path = [
      [0, 2],[1, 2],[2, 2],[3, 2],[4, 2],[5, 2]
    ];

    function createGrid() {
      game.innerHTML = "";
      for (let y = 0; y < SIZE; y++) {
        grid[y] = [];
        for (let x = 0; x < SIZE; x++) {
          const cell = document.createElement("div");
          cell.className = "cell";

          if (path.some(p => p[0] === x && p[1] === y)) {
            cell.classList.add("road");
          }

          cell.onclick = () => placeOperator(x, y);
          game.appendChild(cell);
          grid[y][x] = cell;
        }
      }
    }

    function placeOperator(x, y) {
      const cell = grid[y][x];
      if (cell.classList.contains("road")) return;
      if (cell.classList.contains("operator")) return;

      cell.classList.add("operator");
      operators.push({ x, y, cell });
    }

    function spawnEnemy() {
      const enemy = { i: 0, hp: 5 };
      enemies.push(enemy);
      renderEnemies();
    }

    function renderEnemies() {
      document.querySelectorAll(".enemy").forEach(e => e.remove());
      enemies.forEach(enemy => {
        const [x, y] = path[enemy.i];
        const cell = grid[y][x];
        const eDiv = document.createElement("div");
        eDiv.className = "enemy";
        eDiv.style.width = "100%";
        eDiv.style.height = "100%";
        cell.appendChild(eDiv);
        enemy.el = eDiv;
      });
    }

    function moveEnemies() {
      enemies.forEach((enemy, idx) => {
        enemy.i++;
        if (enemy.i >= path.length) {
          enemies.splice(idx, 1);
        }
      });
      renderEnemies();
    }

    function shoot() {
      operators.forEach(op => {
        enemies.forEach((enemy, ei) => {
          const [ex, ey] = path[enemy.i];
          const dist = Math.abs(op.x - ex) + Math.abs(op.y - ey);
          if (dist <= 2) {
            enemy.hp--;
            if (enemy.hp <= 0) {
              enemies.splice(ei, 1);
            }
          }
        });
      });
      renderEnemies();
    }

    startBtn.onclick = () => {
      spawnEnemy();
      setInterval(moveEnemies, 800);
      setInterval(shoot, 500);
      setInterval(spawnEnemy, 3000);
    };

    createGrid();
  </script>
</body>
</html>
